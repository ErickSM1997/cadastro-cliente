<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cadastro-cliente</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="centralizar-div">
        <form action="formulario" class="formulario">
            <div>
                <h1>Cadastro de clientes</h1>
            </div>
            <div>
                <label for="nome"> Nome Completo

                </label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
            </div>
            <div>
                <label for="cep"> Digite seu CEP

                </label>
                <input type="number" id="cep" name="CEP" placeholder="Exemplo: 00000-000" required>
            </div>
            <div>
                <label for="logradouro"> Logradouro

                </label>
                <input type="text" id="logradouro" name="Logradouro" placeholder="Digite seu endereço" required>
            </div>
            <div>
                <label for="Bairro"> Bairro

                </label>
                <input type="text" id="bairro" name="Bairro" placeholder="Digite seu bairro" required>
            </div>
            <div class="linha">
                <div class="campo-cidade">
                    <label for="Cidade"> Cidade

                    </label>
                    <input type="text" id="cidade" name="Cidade" placeholder="Digite sua cidade" required>
                </div>
                <div class="campo-uf">
                    <label for="uf"> UF

                    </label>
                    <select id="UF" name="UF" required>
                        <option value="">Selecione</option>
                        <option value="AC">Acre (AC)</option>
                        <option value="AL">Alagoas (AL)</option>
                        <option value="AP">Amapá (AP)</option>
                        <option value="AM">Amazonas (AM)</option>
                        <option value="BA">Bahia (BA)</option>
                        <option value="CE">Ceará (CE)</option>
                        <option value="DF">Distrito Federal (DF)</option>
                        <option value="ES">Espírito Santo (ES)</option>
                        <option value="GO">Goiás (GO)</option>
                        <option value="MA">Maranhão (MA)</option>
                        <option value="MT">Mato Grosso (MT)</option>
                        <option value="MS">Mato Grosso do Sul (MS)</option>
                        <option value="MG">Minas Gerais (MG)</option>
                        <option value="PA">Pará (PA)</option>
                        <option value="PB">Paraíba (PB)</option>
                        <option value="PR">Paraná (PR)</option>
                        <option value="PE">Pernambuco (PE)</option>
                        <option value="PI">Piauí (PI)</option>
                        <option value="RJ">Rio de Janeiro (RJ)</option>
                        <option value="RN">Rio Grande do Norte (RN)</option>
                        <option value="RS">Rio Grande do Sul (RS)</option>
                        <option value="RO">Rondônia (RO)</option>
                        <option value="RR">Roraima (RR)</option>
                        <option value="SC">Santa Catarina (SC)</option>
                        <option value="SP">São Paulo (SP)</option>
                        <option value="SE">Sergipe (SE)</option>
                        <option value="TO">Tocantins (TO)</option>
                    </select>
                </div>
            </div>
            <div>
                <label for="email">Seu melhor email

                </label>
                <input type="email" id="email" name="email" placeholder="Digite seu melhor email" required>
            </div>
            <div>
                <label for="celular">Celular

                </label>
                <input type="tel" id="celular" name="celular" placeholder="Exemplo: (99)99999-9999"
                    pattern="(\([0-9]{2}\))\s([0-9]{4,5})-([0-9]{4})"
                    title="Número de telefone deve ser no formato (99) 9999-9999 ou (99) 99999-9999" required>
            </div>
            <div class="centraliza-botao">
                <button type="submit" id="cadastrar">Cadastrar</button>
                <button type="reset" id="limpar">Limpar</button>
                <button type="button" id="base">Base de cadastros</button>
            </div>
        </form>
    </div>

    <div class="centralizar-tabela">
        <div>
            <h2>Clientes Cadastrados</h2>
        </div>
        <table id="tabelaClientes">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>CEP</th>
                    <th>Logradouro</th>
                    <th>Bairro</th>
                    <th>Cidade</th>
                    <th>UF</th>
                    <th>Email</th>
                    <th>Celular</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
    <script src="script.js"></script>
</body>

</html>
